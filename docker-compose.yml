# SIRRealtime: database, server e portale (nginx su http://localhost:8080). Variabili in `.env` (vedi `.env.example`).
# Avvio: docker compose up -d --build    Arresto: docker compose down (i dati restano nei volumi `pgdata` e `assets`).
# Agente scaricabile: scripts/costruisci-agente.sh con USCITA = AGENT_DOWNLOAD_HOST_DIR del .env (sola lettura nel server).
name: sir-realtime

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sir}
      POSTGRES_USER: ${POSTGRES_USER:-sir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sir}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sir}
      HOST: 0.0.0.0
      PORT: 8090
      # Default: il portale servito da nginx (servizio web, porta WEB_PORT), stessa origine di /api e /ws.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_PORT:-8080}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-8080}}
      # Segreto dei codici brevi dei link (/l/<codice>), almeno 32 caratteri: cambiandolo cambiano tutti i QR.
      SHARE_CODE_SECRET: ${SHARE_CODE_SECRET:?imposta SHARE_CODE_SECRET in .env (almeno 32 caratteri)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Dietro nginx (servizio web), che sovrascrive X-Forwarded-For con l'IP reale del client.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      MATCH_MAX_LINES: ${MATCH_MAX_LINES:-20000}
      # Senza i due punti: impostata vuota nel .env resta vuota (hostname sconosciuti = 404).
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG-predefinito}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_INGEST: ${RATE_LIMIT_INGEST:-600}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-6000}
      RATE_LIMIT_PUBLIC_WS: ${RATE_LIMIT_PUBLIC_WS:-6000}
      RATE_LIMIT_PUBLIC_INVALID: ${RATE_LIMIT_PUBLIC_INVALID:-120}
      RATE_LIMIT_SHORT_CODE_INVALID: ${RATE_LIMIT_SHORT_CODE_INVALID:-1000}
      RATE_LIMIT_AGENT_DOWNLOAD: ${RATE_LIMIT_AGENT_DOWNLOAD:-10}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-300}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-10}
      WS_MAX_PER_IP: ${WS_MAX_PER_IP:-2000}
      WS_MAX_TOTAL: ${WS_MAX_TOTAL:-6000}
      # Immagini caricate dai clienti (loghi, sponsor): nel volume `assets`, quota per cliente in MB.
      ASSETS_DIR: /data/assets
      ASSETS_QUOTA_MB: ${ASSETS_QUOTA_MB:-50}
      # Agente per Windows offerto dal portale (sir-agent.exe e sir-agent.json di scripts/costruisci-agente.sh).
      AGENT_DOWNLOAD_DIR: /data/downloads
    volumes:
      - assets:/data/assets
      # Sola lettura: la scrive solo scripts/costruisci-agente.sh sull'host (USCITA = AGENT_DOWNLOAD_HOST_DIR).
      - ${AGENT_DOWNLOAD_HOST_DIR:-downloads}:/data/downloads:ro
    # Browser e agente passano da nginx (servizio web, anche per /api/ingest). La porta 8090 resta pubblicata solo su
    # 127.0.0.1 per prove locali e scansioni (docs/server.md): mai su 0.0.0.0, perché con TRUST_PROXY=true un client
    # che arriva diretto potrebbe falsificare X-Forwarded-For ed eludere il rate limit.
    ports:
      - '${SERVER_BIND:-127.0.0.1}:8090:8090'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    # Descrittori di file per nginx (worker_rlimit_nofile in docker/web.nginx.main.conf): ogni WebSocket ne usa 2.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
  assets:
  downloads:
