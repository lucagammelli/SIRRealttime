# Solo produzione (montato da docker/compose.produzione.yml): nginx sta dietro Caddy, che inoltra X-Forwarded-For
# con l'IP vero del client. Ci si fida dell'header soltanto se la connessione arriva dalla rete interna di compose
# (sottorete fissa di compose.produzione.yml); da qualunque altro indirizzo l'header viene ignorato.
set_real_ip_from 172.29.250.0/24;
set_real_ip_from fd29:250::/64;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
