components:
  schemas:
    LayoutBlocks:
      type: array
      maxItems: 24
      items:
        type: object
        required: [id, type]
        properties:
          id: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$', example: messaggio }
          type:
            type: string
            enum:
              [
                scoreboard,
                momentum,
                comparison,
                players,
                court,
                rotations,
                logo,
                sponsor,
                message,
                qr,
                lastPoint,
                setScores,
                topPlayers,
                setScorers,
                aces,
                blocks,
                attack,
                roleDuel,
                teamDuel,
              ]
            example: message
          width: { type: integer, minimum: 1, maximum: 12, example: 12 }
          visible: { type: boolean, example: true }
          collapsed: { type: boolean, example: false }
          options:
            type: object
            description: 'opzioni del tipo: message text, qr caption, sponsor images e seconds, logo variant, topPlayers count e team; statistiche period (set, match), setScorers e attack limit, roleDuel role (rotate, opposite, outside, middle, setter, libero), teamDuel rows'
            example: { text: Benvenuti al palazzetto! }
    Intermission:
      type: object
      properties:
        enabled: { type: boolean, example: true }
        modes:
          type: object
          properties:
            tv: { type: string, enum: [fullscreen, banner], example: fullscreen }
            tablet: { type: string, enum: [fullscreen, banner], example: fullscreen }
            phone: { type: string, enum: [fullscreen, banner], example: banner }
        delaySeconds: { type: integer, minimum: 0, maximum: 60, example: 5 }
        slides:
          type: array
          maxItems: 12
          items:
            type: object
            required: [id, type]
            properties:
              id: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$', example: grazie }
              type:
                type: string
                enum:
                  [
                    setSummary,
                    finalResult,
                    mvp,
                    setScores,
                    setScorers,
                    aces,
                    blocks,
                    attack,
                    roleDuel,
                    teamDuel,
                    sponsor,
                    message,
                    qr,
                    logo,
                  ]
                example: message
              seconds: { type: integer, minimum: 3, maximum: 60, example: 8 }
              options:
                type: object
                description: 'opzioni come i blocchi: message text e size, qr caption, sponsor images e seconds, logo variant; statistiche period, limit, role, rows'
                example: { text: Grazie per aver seguito la partita }
    Overlay:
      type: object
      properties:
        enabled: { type: boolean, example: true }
        text:
          type: string
          maxLength: 80
          description: 'testo semplice, segnaposto {giocatore} {numero} {squadra} {punteggio} {set} {serie} {attacchi}; niente < >'
          example: 'ACE! {giocatore}'
        seconds: { type: integer, minimum: 2, maximum: 8, example: 4 }
        devices:
          type: object
          properties:
            tv: { type: boolean, example: true }
            tablet: { type: boolean, example: true }
            phone: { type: boolean, example: true }
        priority: { type: integer, minimum: 1, maximum: 10, example: 6 }
        background:
          type: object
          description: "sfondo dietro al testo: immagine o video del cliente caricato per gli avvisi (facoltativo)"
          additionalProperties: false
          required: [kind, assetId]
          properties:
            kind: { type: string, enum: [image, video], example: image }
            assetId: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
