# Intestazioni di sicurezza delle pagine del portale (incluse in ogni location che serve file statici).
# CSP senza 'unsafe-inline' e senza 'unsafe-eval': gli script e i fogli di stile sono solo file della build;
# ECharts disegna i tooltip nel canvas (renderMode richText) e imposta gli stili via CSSOM, non bloccato dalla CSP.
# blob: per immagini e video: gli sfondi degli avvisi sono letti in memoria all'apertura della pagina live.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# Il token del link pubblico è nell'URL: non deve finire nel Referer di altri siti.
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
