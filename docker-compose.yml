# SIRRealtime: database e server. Variabili in `.env` (vedi `.env.example`).
# Avvio: docker compose up -d --build    Arresto: docker compose down (i dati restano nel volume `pgdata`).
name: sir-realtime

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sir}
      POSTGRES_USER: ${POSTGRES_USER:-sir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sir}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sir}
      HOST: 0.0.0.0
      PORT: 8090
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MATCH_MAX_LINES: ${MATCH_MAX_LINES:-20000}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_INGEST: ${RATE_LIMIT_INGEST:-600}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-120}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-300}
    ports:
      - '${SERVER_BIND:-127.0.0.1}:8090:8090'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
