openapi: 3.0.3
info:
  title: ArenaLive server
  version: 0.1.0
  description: >
    Specifica ricavata a mano dalle rotte di apps/server/src/routes/*.ts e dagli schemi di packages/shared,
    usata dalla scansione DAST (scripts/dast_zap.sh). Le rotte WebSocket (/ws/*) e /api/auth/logout (chiuderebbe la sessione di prova) non sono incluse.
servers:
  - url: /
paths:
  /api/health:
    get:
      responses:
        '200': { description: ok }
  /api/auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: admin@arenalive.local }
                password: { type: string, example: password-di-prova }
      responses:
        '200': { description: utente autenticato }
        '401': { description: credenziali errate }
  /api/auth/me:
    get:
      responses:
        '200': { description: utente corrente }
        '401': { description: non autenticato }
  /api/ingest:
    post:
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocol, matchKey, seq, kind, fromIndex, lines, contentHash]
              properties:
                protocol: { type: integer, example: 1 }
                matchKey: { type: string, example: partita-dast }
                seq: { type: integer, example: 1 }
                kind: { type: string, enum: [append, snapshot], example: snapshot }
                fromIndex: { type: integer, example: 0 }
                lines: { type: array, items: { type: string }, example: ['*p01:00'] }
                header: { type: string, example: '[3DATAVOLLEYSCOUT]' }
                contentHash: { type: string, example: e28eae629bc35ffd823c9cf9361584a5f5320f54502f3a17047c9329e8036e38 }
      responses:
        '200': { description: esito ingest }
        '401': { description: token agente mancante o errato }
  /api/agents/registrations:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: agente-dast }
      responses:
        '201': { description: richiesta di registrazione creata (segreto e codice di abbinamento) }
        '429': { description: troppe richieste o troppe richieste in attesa }
  /api/agents/registrations/status:
    post:
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          {
            description: 'stato della richiesta: pending, approved (token una volta sola), consumed, rejected, expired',
          }
        '401': { description: segreto di registrazione mancante o errato }
  /api/public/{token}/state:
    get:
      parameters:
        - name: token
          in: path
          required: true
          description: >-
            token lungo del link (base64url, 22-128 caratteri) oppure codice breve di 8 caratteri senza 0/O/1/I
            (anche minuscolo e con un trattino a metà, es. K7M2-QX9P)
          schema: { type: string, example: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA }
      responses:
        '200': { description: stato della partita }
        '404': { description: link non valido }
        '429': { description: 'troppi link sbagliati da questo IP, o troppi codici brevi sbagliati da tutti gli IP' }
  /api/public/tenant:
    get:
      responses:
        '200':
          {
            description: "grafica del cliente dell'hostname: nome, colori, loghi, blocchi, pause e avvisi della pagina pubblica",
          }
        '404': { description: hostname senza cliente }
  /api/public/assets/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      responses:
        '200': { description: "file dell'immagine (PNG, JPEG, WebP o SVG) o del video (MP4, WebM)" }
        '206': { description: "una parte del file (intestazione Range bytes=a-b)" }
        '404': { description: immagine inesistente o di un altro cliente }
        '416': { description: intervallo Range fuori dal file }
  /api/public/team-logos/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      responses:
        '200':
          {
            description: logo di una squadra scaricato dal sito della Lega (PNG,
            JPEG,
            WebP o SVG),
            comune a tutti i clienti,
          }
        '404': { description: logo inesistente }
  /api/public/system-logos:
    get:
      responses:
        '200': { description: loghi di sistema (sinistra e destra, positivo e negativo), uguali per tutti i clienti }
  /api/public/system-logos/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      responses:
        '200': { description: file del logo di sistema (PNG, JPEG, WebP o SVG) }
        '404': { description: logo inesistente }
  /api/admin/system-logos/{slot}/{variant}:
    put:
      parameters:
        - name: slot
          in: path
          required: true
          schema: { type: string, enum: [left, right], example: left }
        - name: variant
          in: path
          required: true
          schema: { type: string, enum: [positive, negative], example: positive }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              additionalProperties: false
              properties:
                data:
                  type: string
                  format: byte
                  description: logo in base64 (al massimo 150x50 px e 2 MB)
                  example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAAAAAA6fptVAAAACklEQVR4nGNgAAAAAgABc3UBGAAAAABJRU5ErkJggg==
      responses:
        '200': { description: logo caricato, elenco aggiornato }
        '403': { description: solo superadmin }
        '413': { description: immagine oltre 2 MB }
        '422': { description: formato non ammesso o logo oltre 150x50 px }
    delete:
      parameters:
        - name: slot
          in: path
          required: true
          schema: { type: string, enum: [left, right], example: right }
        - name: variant
          in: path
          required: true
          schema: { type: string, enum: [positive, negative], example: negative }
      responses:
        '200': { description: logo rimosso, elenco aggiornato }
        '403': { description: solo superadmin }
  /api/admin/matches:
    get:
      responses:
        '200': { description: elenco partite }
  /api/admin/matches/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      responses:
        '200': { description: dettaglio partita }
        '404': { description: non trovata }
  /api/admin/agents:
    get:
      responses:
        '200': { description: elenco agenti }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: agente-dast }
      responses:
        '200': { description: agente creato }
  /api/admin/agents/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      responses:
        '204': { description: revocato }
        '404': { description: non trovato }
    patch:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, example: { name: agente-rinominato } }
      responses:
        '200': { description: agente aggiornato }
        '404': { description: non trovato }
  /api/admin/agent/info:
    get:
      responses:
        '200': { description: 'agente per Windows pubblicato (versione, data, dimensione) o available: false' }
        '403': { description: ruolo insufficiente (serve admin) }
  /api/admin/agent/download:
    get:
      responses:
        '200':
          description: zip dell'agente per il cliente (arenalive-agent.exe, config.json senza token, branding.json, logo, LEGGIMI.txt)
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { description: ruolo insufficiente (serve admin) }
        '404': { description: agente non ancora pubblicato sul server }
  /api/admin/agent-registrations:
    get:
      responses:
        '200': { description: richieste di registrazione in attesa }
  /api/admin/agent-registrations/{id}/approve:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: richiesta abilitata }
        '404': { description: non in attesa o scaduta }
  /api/admin/agent-registrations/{id}/reject:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: richiesta rifiutata }
        '404': { description: non in attesa o scaduta }
  /api/admin/share-tokens:
    get:
      responses:
        '200':
          { description: 'elenco link, con shortCode e shortUrl (<base del cliente>/l/<codice>; null se revocato)' }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, matchId, expiresAt]
              properties:
                label: { type: string, example: link-dast }
                matchId: { type: string, format: uuid, nullable: true, example: null }
                expiresAt: { type: string, format: date-time, nullable: true, example: null }
      responses:
        '201': { description: 'link creato: token e url (una volta sola), shortCode e shortUrl' }
        '403': { description: 'MATCH_LINKS_DISABLED: partita fissa senza «Link e QR per singola partita»' }
  /api/admin/share-tokens/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      responses:
        '204': { description: revocato }
        '404': { description: non trovato }
  /api/admin/users:
    get:
      responses:
        '200': { description: elenco utenti }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string, example: viewer-dast@arenalive.local }
                password: { type: string, example: password-lunga-di-prova }
                role: { type: string, enum: [admin, viewer], example: viewer }
      responses:
        '200': { description: utente creato }
  /api/admin/tenants:
    get:
      responses:
        '200': { description: elenco clienti (solo superadmin) }
        '403': { description: non superadmin }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, hostnames]
              properties:
                slug: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,48}[a-z0-9])?$', example: cliente-dast }
                name: { type: string, example: Cliente DAST }
                hostnames: { type: array, items: { type: string }, example: [dast.arenalive.local] }
      responses:
        '201': { description: cliente creato }
        '409': { description: slug o hostname già usati }
  /api/admin/tenants/{id}:
    patch:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Cliente DAST }
                hostnames: { type: array, items: { type: string }, example: [dast.arenalive.local] }
                agentQuota: { type: integer, minimum: 0, maximum: 100, example: 1 }
                matchLinksEnabled: { type: boolean, example: true }
      responses:
        '200': { description: 'cliente modificato (matchLinksEnabled false revoca per sempre i link per partita)' }
        '404': { description: non trovato }
        '409': { description: hostname di un altro cliente }
  /api/admin/active-tenant:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: { type: string, format: uuid, nullable: true, example: null }
      responses:
        '200': { description: cliente su cui lavora il superadmin }
        '403': { description: non superadmin }
        '404': { description: cliente inesistente }
  /api/admin/branding:
    get:
      responses:
        '200': { description: grafica del cliente della sessione }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, nullable: true, example: Cliente DAST }
                colors:
                  type: object
                  properties:
                    primary: { type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#003399' }
                    accent: { type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#c2410c' }
                    home: { type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#1d4ed8' }
                    away: { type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#a21caf' }
                    background: { type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#eef2f7' }
                logoMain: { type: string, format: uuid, nullable: true, example: null }
                logoMark: { type: string, format: uuid, nullable: true, example: null }
                sponsorLogo: { type: string, format: uuid, nullable: true, example: null }
      responses:
        '200': { description: grafica salvata }
        '400': { description: colori non validi o immagine non del cliente }
  /api/admin/branding/export:
    get:
      responses:
        '200': { description: pacchetto JSON della grafica del cliente (download) }
  /api/admin/branding/import:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, version]
              properties:
                format: { type: string, example: arenalive-grafica }
                version: { type: integer, example: 1 }
      responses:
        '200': { description: grafica sostituita }
        '400': { description: pacchetto non valido o di versione non supportata }
        '403': { description: tema personalizzato senza essere superadmin }
        '422': { description: immagine rifiutata }
  /api/admin/layout:
    get:
      responses:
        '200': { description: 'blocchi della pagina pubblica del cliente della sessione: TV, tablet, telefono' }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tv: { $ref: '#/components/schemas/LayoutBlocks' }
                tablet: { $ref: '#/components/schemas/LayoutBlocks' }
                phone: { $ref: '#/components/schemas/LayoutBlocks' }
      responses:
        '200': { description: pagina pubblica salvata }
        '400': { description: 'tipo di blocco sconosciuto, opzioni o larghezza non valide, immagine non del cliente' }
  /api/admin/intermissions:
    get:
      responses:
        '200':
          {
            description: 'pause della pagina pubblica del cliente della sessione: time-out, fine set, fine partita, ogni N punti, dopo la partita',
          }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout: { $ref: '#/components/schemas/Intermission' }
                setBreak: { $ref: '#/components/schemas/Intermission' }
                setBreakBySet:
                  type: object
                  properties:
                    '1': { $ref: '#/components/schemas/Intermission' }
                    '2': { $ref: '#/components/schemas/Intermission' }
                    '3': { $ref: '#/components/schemas/Intermission' }
                    '4': { $ref: '#/components/schemas/Intermission' }
                matchEnd: { $ref: '#/components/schemas/Intermission' }
                milestone:
                  allOf:
                    - { $ref: '#/components/schemas/Intermission' }
                    - type: object
                      properties:
                        every: { type: integer, minimum: 4, maximum: 25, example: 8 }
                        stopBeforeEnd:
                          {
                            type: integer,
                            minimum: 1,
                            maximum: 15,
                            example: 5,
                            description: 'niente pausa negli ultimi K punti del set (traguardo 25, 15 al tie-break)',
                          }
                afterMatch:
                  type: object
                  description: 'Dopo la partita: foto a tutto schermo con il conto alla rovescia della prossima partita'
                  properties:
                    enabled: { type: boolean, example: false }
                    image: { type: string, format: uuid, nullable: true, description: 'immagine (sponsor) del cliente' }
                    delayMinutes: { type: integer, minimum: 0, maximum: 240, example: 30 }
      responses:
        '200': { description: pause salvate }
        '400':
          {
            description: 'tipo di diapositiva sconosciuto, durata o ritardo fuori dai limiti, immagine non del cliente',
          }
  /api/admin/overlays:
    get:
      responses:
        '200': { description: 'avvisi degli eventi della partita del cliente della sessione: ace, muro, set point…' }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ace: { $ref: '#/components/schemas/Overlay' }
                block: { $ref: '#/components/schemas/Overlay' }
                run: { $ref: '#/components/schemas/Overlay' }
                longRally: { $ref: '#/components/schemas/Overlay' }
                setPoint: { $ref: '#/components/schemas/Overlay' }
                matchPoint: { $ref: '#/components/schemas/Overlay' }
                tie: { $ref: '#/components/schemas/Overlay' }
                lead: { $ref: '#/components/schemas/Overlay' }
                timeout: { $ref: '#/components/schemas/Overlay' }
                substitution: { $ref: '#/components/schemas/Overlay' }
                setEnd: { $ref: '#/components/schemas/Overlay' }
                matchEnd: { $ref: '#/components/schemas/Overlay' }
      responses:
        '200': { description: avvisi salvati }
        '400': { description: 'evento o segnaposto sconosciuto, HTML nel testo, durata o priorità fuori dai limiti, sfondo non del cliente o di tipo diverso' }
  /api/admin/assets:
    get:
      responses:
        '200': { description: immagini del cliente e spazio usato }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, data]
              properties:
                kind: { type: string, enum: [logo, sponsor, overlay], example: logo }
                data:
                  type: string
                  format: byte
                  description: immagine in base64 (al massimo 2 MB)
                  example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAAAAAA6fptVAAAACklEQVR4nGNgAAAAAgABc3UBGAAAAABJRU5ErkJggg==
                sponsorId: { type: string, format: uuid, description: 'sponsor del cliente (solo kind sponsor)' }
      responses:
        '201': { description: immagine caricata }
        '200': { description: immagine già presente }
        '409': { description: spazio del cliente esaurito }
        '413': { description: immagine oltre 2 MB }
        '422': { description: non è un'immagine ammessa (PNG, JPEG, WebP, SVG senza script) }
  /api/admin/assets/video:
    post:
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: byte del video MP4 o WebM (al massimo 15 MB), sfondo degli avvisi
      responses:
        '201': { description: video caricato }
        '200': { description: video già presente }
        '401': { description: senza sessione }
        '403': { description: ruolo non admin o origine non ammessa }
        '409': { description: spazio del cliente esaurito }
        '413': { description: video oltre 15 MB }
        '415': { description: corpo non application/octet-stream }
        '422': { description: non è un video MP4 o WebM }
  /api/admin/assets/{id}:
    patch:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sponsorId]
              additionalProperties: false
              properties:
                sponsorId: { type: string, format: uuid, nullable: true, example: null }
      responses:
        '200': { description: sponsor dell'immagine cambiato }
        '400': { description: sponsor non del cliente o immagine non sponsor }
        '404': { description: non trovata }
        '409': { description: sponsor con troppe immagini o immagine di un altro sponsor }
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      responses:
        '204': { description: eliminata }
        '404': { description: non trovata }
  /api/admin/assets/{id}/file:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      responses:
        '200': { description: file dell'immagine del cliente della sessione (miniature dell'area riservata) }
        '400': { description: id non valido }
        '404': { description: immagine inesistente o di un altro cliente }
        '409': { description: 'in uso nella grafica, nella pagina pubblica o nelle pause' }
  /api/admin/sponsors:
    get:
      responses:
        '200': { description: sponsor del cliente in ordine, con le loro immagini }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80, example: Sponsor DAST }
                website: { type: string, nullable: true, example: 'https://sponsor.example.it' }
      responses:
        '201': { description: sponsor creato }
        '409': { description: nome già usato o troppi sponsor }
  /api/admin/sponsors/order:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids: { type: array, items: { type: string, format: uuid }, example: [] }
      responses:
        '200': { description: nuovo ordine degli sponsor }
        '400': { description: l'elenco non contiene tutti gli sponsor una volta }
  /api/admin/sponsors/{id}:
    patch:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80, example: Sponsor DAST }
                website: { type: string, nullable: true, example: null }
      responses:
        '200': { description: sponsor modificato }
        '404': { description: non trovato }
        '409': { description: nome di un altro sponsor }
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 }
      responses:
        '204': { description: eliminato con le immagini non usate altrove }
        '404': { description: non trovato }
