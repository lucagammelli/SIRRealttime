# Scansione DAST (HawkScan) dello stack completo dietro nginx: portale React (SPA) + API del server.
# Target: docker compose (vedi docs/portale.md), portale su WEB_PORT; per la scansione i RATE_LIMIT_* del .env
# vanno alzati (es. 100000) e il servizio server ricreato.
# Assunzioni (scansione non interattiva): stessa specifica OpenAPI del server (le rotte /api passano da nginx);
# Ajax Spider per la SPA a partire da /admin e dalla pagina pubblica di un link valido (LIVE_PATH);
# utente admin di prova = admin del cliente «Predefinito» (SCAN_USERNAME), creato come spiegato in stackhawk.yml: il
# superadmin fuori da un cliente riceve 409 TENANT_REQUIRED; logout escluso; WebSocket non coperti.
app:
  applicationId: ${APP_ID:f32f36a0-c2c0-4f08-b702-d7f354926012}
  env: ${APP_ENV:Development}
  host: ${APP_HOST:http://localhost:8085}
  openApiConf:
    filePath: stackhawk/openapi.yaml
  excludePaths:
    - "/api/auth/logout"
  authentication:
    loggedInIndicator: "\\Q\"role\"\\E"
    loggedOutIndicator: "HTTP/1.1 401"
    usernamePassword:
      type: JSON
      loginPath: /api/auth/login
      usernameField: email
      passwordField: password
      scanUsername: ${SCAN_USERNAME:scan@sir.local}
      scanPassword: ${SCAN_PASSWORD:password-scansione-1}
    cookieAuthorization:
      cookieNames:
        - sir_session
    testPath:
      path: /api/auth/me
      success: ".*200.*"
hawk:
  spider:
    base: true
    ajax: true
    seedPaths:
      - /admin
      - ${LIVE_PATH:/live/token-non-valido-per-la-scansione}
# Token agente (creato con POST /api/admin/agents) per raggiungere /api/ingest autenticati.
hawkAddOn:
  replacer:
    rules:
      - matchString: Authorization
        replacement: ${AGENT_AUTH_HEADER:Bearer none}
        replaceOnly: false
tags:
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
  - name: git_origin
    value: lucagammelli/sirrealttime
