# nginx.conf principale del portale (docker/web.Dockerfile la copia in /etc/nginx/nginx.conf): come quella di
# nginxinc/nginx-unprivileged (pid e file temporanei in /tmp, utente non root), con i limiti alzati per gli spettatori.
# Ogni WebSocket pubblico occupa 2 connessioni (client e upstream verso il server): con WS_MAX_TOTAL=6000 ne servono
# 12000, più le richieste HTTP (pagina, file, API). 16384 per worker basta anche con un solo worker.

worker_processes  auto;
# Descrittori per worker: uno per connessione, più file serviti e log. Il limite rigido del container
# (`ulimits: nofile` del servizio web in docker-compose.yml) deve essere almeno questo.
worker_rlimit_nofile 40000;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  16384;
    # Accetta in un colpo tutte le connessioni in attesa: utile quando migliaia di telefoni si ricollegano insieme.
    multi_accept on;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # I token dei link pubblici e i codici brevi sono nel percorso: nei log restano solo mascherati
    # (/l/[codice], /live/[token], /api/public/[token]/..., /ws/public/[token]) e dei link di invito e di recupero password
    # (/admin/invito/[token], /admin/reimposta-password/[token], /api/auth/links/[token]); la grafica del cliente
    # (/api/public/tenant, /api/public/assets/...) resta leggibile. Stesso criterio di redactUrl nel server.
    map $request_uri $sir_log_uri {
        ~*^/api/public/(?:tenant(?:[?#]|$)|assets/)    $request_uri;
        ~*^/l/[^/?#]+(?<sir_l_rest>.*)$                 /l/[codice]$sir_l_rest;
        ~*^/live/[^/?#]+(?<sir_live_rest>.*)$           /live/[token]$sir_live_rest;
        ~*^/(?<sir_pub>api|ws)/public/[^/?#]+(?<sir_pub_rest>.*)$    /$sir_pub/public/[token]$sir_pub_rest;
        ~*^/api/auth/links/[^/?#]+(?<sir_lnk_rest>.*)$  /api/auth/links/[token]$sir_lnk_rest;
        ~*^/admin/(?<sir_acc>invito|reimposta-password)/[^/?#]+(?<sir_acc_rest>.*)$    /admin/$sir_acc/[token]$sir_acc_rest;
        default                                        $request_uri;
    }
    # Il Referer può contenere gli stessi percorsi (il portale manda no-referrer, ma un client può mandarlo).
    map $http_referer $sir_log_referer {
        ~*(?:/l/|/live/|/api/public/|/ws/public/|/api/auth/links/|/admin/invito/|/admin/reimposta-password/)      [omesso];
        default                                        $http_referer;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $sir_log_uri $server_protocol" '
                      '$status $body_bytes_sent "$sir_log_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
