# Scansione DAST (HawkScan) del server SIRRealtime (apps/server).
# Avvio del target (PGlite in memoria, limiti alzati per non falsare la scansione):
#   cd apps/server && DATABASE_URL=pglite:memory COOKIE_SECURE=false ADMIN_EMAIL=admin@sir.local \
#   ADMIN_PASSWORD=password-di-prova CORS_ORIGIN=http://localhost:5173 RATE_LIMIT_LOGIN=100000 \
#   RATE_LIMIT_ADMIN=100000 RATE_LIMIT_PUBLIC=100000 RATE_LIMIT_INGEST=100000 \
#   RATE_LIMIT_REGISTER=100000 pnpm dev
# Utente della scansione: un admin del cliente «Predefinito» (SCAN_USERNAME/SCAN_PASSWORD), non il superadmin, che
# fuori da un cliente riceve 409 TENANT_REQUIRED su ogni rotta admin e HawkScan non sa entrare in un cliente. Va
# creato una volta, a server avviato, con il superadmin di ADMIN_EMAIL:
#   SERVER="http://localhost:8090"; SUPER_EMAIL="admin@sir.local"; SUPER_PASSWORD="password-di-prova"
#   SCAN_EMAIL="scan@sir.local"; SCAN_PASS="password-scansione-1"; JAR="/tmp/sir-scan.cookies"
#   curl -s -c "$JAR" -H "Content-Type: application/json" -d "{\"email\":\"$SUPER_EMAIL\",\"password\":\"$SUPER_PASSWORD\"}" "$SERVER/api/auth/login"
#   ID=$(curl -s -b "$JAR" "$SERVER/api/admin/tenants" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).find(t=>t.slug==='predefinito').id))")
#   curl -s -b "$JAR" -H "Content-Type: application/json" -d "{\"tenantId\":\"$ID\"}" "$SERVER/api/admin/active-tenant"
#   curl -s -b "$JAR" -H "Content-Type: application/json" -d "{\"email\":\"$SCAN_EMAIL\",\"password\":\"$SCAN_PASS\",\"role\":\"admin\"}" "$SERVER/api/admin/users"
# Assunzioni (scansione non interattiva): specifica OpenAPI ricavata a mano dalle rotte (stackhawk/openapi.yaml);
# le rotte del solo superadmin (/api/admin/tenants, /api/admin/leagues, /api/admin/active-tenant) rispondono 403;
# il logout è escluso per non chiudere la sessione; i WebSocket non sono coperti.
app:
  applicationId: ${APP_ID:f32f36a0-c2c0-4f08-b702-d7f354926012}
  env: ${APP_ENV:Development}
  host: ${APP_HOST:http://localhost:8090}
  openApiConf:
    filePath: stackhawk/openapi.yaml
  excludePaths:
    - '/api/auth/logout'
  authentication:
    loggedInIndicator: "\\Q\"role\"\\E"
    loggedOutIndicator: 'HTTP/1.1 401'
    usernamePassword:
      type: JSON
      loginPath: /api/auth/login
      usernameField: email
      passwordField: password
      scanUsername: ${SCAN_USERNAME:scan@sir.local}
      scanPassword: ${SCAN_PASSWORD:password-scansione-1}
    cookieAuthorization:
      cookieNames:
        - sir_session
    testPath:
      path: /api/auth/me
      success: '.*200.*'
# Token agente (creato con POST /api/admin/agents sul server in prova) per raggiungere /api/ingest autenticati.
# Le rotte admin usano il cookie di sessione e ignorano questo header.
hawkAddOn:
  replacer:
    rules:
      - matchString: Authorization
        replacement: ${AGENT_AUTH_HEADER:Bearer none}
        replaceOnly: false
tags:
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
  - name: git_origin
    value: lucagammelli/sirrealttime
