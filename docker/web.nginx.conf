# nginx del portale (docker/web.Dockerfile): serve la SPA di apps/web e fa da proxy per /api e /ws verso il server.
# Il portale e le API sono sulla stessa origine: CORS_ORIGIN e PUBLIC_BASE_URL del server = indirizzo di questo nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    # Corpo massimo: l'ingest dell'agente accetta fino a 2 MB sul filo (docs/server.md), il caricamento di
    # un'immagine (POST /api/admin/assets, 2 MB in base64) circa 2,7 MB; le altre rotte 64 KB. Il video degli sfondi
    # degli avvisi ha la sua location, più sotto.
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: le intestazioni di sicurezza le mette il server (helmet). X-Forwarded-For è sovrascritto (non accodato)
    # con l'IP reale del client: il server, con TRUST_PROXY=true, non può essere ingannato da un valore inviato dal client.
    location /api/ {
        proxy_pass http://server:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Caricamento di un video per gli sfondi degli avvisi (POST /api/admin/assets/video, file fino a 15 MB): solo qui
    # un corpo più grande; il server controlla di nuovo la dimensione, la sessione e il ruolo prima di leggerlo.
    location = /api/admin/assets/video {
        client_max_body_size 16m;
        proxy_pass http://server:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Zip dell'agente per Windows (~90 MB, generato al volo dal server): passato al browser senza copia su disco.
    location = /api/admin/agent/download {
        proxy_pass http://server:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Immagine della scheda SD dei Player (~750 MB, file statico del server): passata al browser senza copia su disco.
    location = /api/admin/player/image {
        proxy_pass http://server:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://server:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Il server manda un ping ogni 30 s: una connessione viva non resta mai ferma così a lungo.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # File con hash nel nome: in cache per sempre.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: ogni altro percorso (/live/<token>, /admin/...) riceve index.html, mai in cache.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
