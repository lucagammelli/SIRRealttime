# Scansione DAST (HawkScan) del server SIRRealtime (apps/server).
# Avvio del target (PGlite in memoria, limiti alzati per non falsare la scansione):
#   cd apps/server && DATABASE_URL=pglite:memory COOKIE_SECURE=false ADMIN_EMAIL=admin@sir.local \
#   ADMIN_PASSWORD=password-di-prova CORS_ORIGIN=http://localhost:5173 RATE_LIMIT_LOGIN=100000 \
#   RATE_LIMIT_ADMIN=100000 RATE_LIMIT_PUBLIC=100000 RATE_LIMIT_INGEST=100000 \
#   RATE_LIMIT_REGISTER=100000 pnpm dev
# Assunzioni (scansione non interattiva): specifica OpenAPI ricavata a mano dalle rotte (stackhawk/openapi.yaml);
# utente admin di prova; il logout è escluso per non chiudere la sessione; i WebSocket non sono coperti.
app:
  applicationId: ${APP_ID:f32f36a0-c2c0-4f08-b702-d7f354926012}
  env: ${APP_ENV:Development}
  host: ${APP_HOST:http://localhost:8090}
  openApiConf:
    filePath: stackhawk/openapi.yaml
  excludePaths:
    - '/api/auth/logout'
  authentication:
    loggedInIndicator: "\\Q\"role\"\\E"
    loggedOutIndicator: 'HTTP/1.1 401'
    usernamePassword:
      type: JSON
      loginPath: /api/auth/login
      usernameField: email
      passwordField: password
      scanUsername: ${SCAN_USERNAME:admin@sir.local}
      scanPassword: ${SCAN_PASSWORD:password-di-prova}
    cookieAuthorization:
      cookieNames:
        - sir_session
    testPath:
      path: /api/auth/me
      success: '.*200.*'
# Token agente (creato con POST /api/admin/agents sul server in prova) per raggiungere /api/ingest autenticati.
# Le rotte admin usano il cookie di sessione e ignorano questo header.
hawkAddOn:
  replacer:
    rules:
      - matchString: Authorization
        replacement: ${AGENT_AUTH_HEADER:Bearer none}
        replaceOnly: false
tags:
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
  - name: git_origin
    value: lucagammelli/sirrealttime
